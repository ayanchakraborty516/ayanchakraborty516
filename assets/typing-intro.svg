<svg xmlns="http://www.w3.org/2000/svg" width="440" height="64" viewBox="0 0 440 64" fill="none" role="img" aria-labelledby="title desc">
<title id="title">What I build</title><desc id="desc">Building React apps. Connecting Node.js APIs. Creating useful products.</desc>
<defs><clipPath id="reveal-0"><rect class="reveal" x="0" y="-24" width="240" height="32"/></clipPath><clipPath id="reveal-1"><rect class="reveal" x="0" y="-24" width="288" height="32"/></clipPath><clipPath id="reveal-2"><rect class="reveal" x="0" y="-24" width="300" height="32"/></clipPath></defs>
<style>
  .line { opacity: 0; } .line-0 { opacity: 1; }
  .reveal { transform-origin: 0 0; animation: reveal 4s steps(25, end) infinite; }
  @keyframes reveal { 0% { transform:scaleX(0); } 45%,82% { transform:scaleX(1); } 100% { transform:scaleX(0); } }
  @keyframes show { 0%,33.32% { opacity:1; } 33.33%,100% { opacity:0; } }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
.line-0 { animation: show 12s 0s step-end infinite; }
.cursor-0 { transform:translateX(240px); animation: cursor-0 4s steps(20, end) infinite, blink .9s step-end infinite; }
@keyframes cursor-0 { 0% {transform:translateX(0);} 45%,82% {transform:translateX(240px);} 100% {transform:translateX(0);} }
.line-1 { animation: show 12s -8s step-end infinite; }
.cursor-1 { transform:translateX(288px); animation: cursor-1 4s steps(24, end) infinite, blink .9s step-end infinite; }
@keyframes cursor-1 { 0% {transform:translateX(0);} 45%,82% {transform:translateX(288px);} 100% {transform:translateX(0);} }
.line-2 { animation: show 12s -4s step-end infinite; }
.cursor-2 { transform:translateX(300px); animation: cursor-2 4s steps(25, end) infinite, blink .9s step-end infinite; }
@keyframes cursor-2 { 0% {transform:translateX(0);} 45%,82% {transform:translateX(300px);} 100% {transform:translateX(0);} }
  @media (prefers-reduced-motion: reduce) { .line, .reveal, .cursor { animation:none; } .line { opacity:0; } .line-0 { opacity:1; } .cursor { display:none; } }
</style>
<rect x="1" y="1" width="438" height="62" rx="15" fill="#101B2C" stroke="#32445D"/>
<path d="M23 25L31 32L23 39" stroke="#7DE5CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace"><g class="line line-0" transform="translate(48 39)"><text clip-path="url(#reveal-0)" fill="#E6F0FC" font-size="20" textLength="240" lengthAdjust="spacingAndGlyphs">Building React apps.</text><rect class="cursor cursor-0" x="3" y="-20" width="2" height="23" rx="1" fill="#7DE5CE"/></g><g class="line line-1" transform="translate(48 39)"><text clip-path="url(#reveal-1)" fill="#E6F0FC" font-size="20" textLength="288" lengthAdjust="spacingAndGlyphs">Connecting Node.js APIs.</text><rect class="cursor cursor-1" x="3" y="-20" width="2" height="23" rx="1" fill="#7DE5CE"/></g><g class="line line-2" transform="translate(48 39)"><text clip-path="url(#reveal-2)" fill="#E6F0FC" font-size="20" textLength="300" lengthAdjust="spacingAndGlyphs">Creating useful products.</text><rect class="cursor cursor-2" x="3" y="-20" width="2" height="23" rx="1" fill="#7DE5CE"/></g></g>
</svg>
