<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ayan Chakraborty — Full-stack developer</title>
  <desc id="desc">A compact navy banner with teal and lavender accents. Interfaces, APIs, useful products. Motion pauses when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="surface" x2="600" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#0C1728"/><stop offset="1" stop-color="#1A1831"/></linearGradient>
    <linearGradient id="accent" x1="38" x2="562" gradientUnits="userSpaceOnUse"><stop stop-color="#66E3CB"/><stop offset="1" stop-color="#BBA9FF"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#AFBAD4" opacity=".09"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="598" height="408" rx="24"/></clipPath>
  </defs>
  <style>
    .orbit { transform-origin: 508px 81px; animation: orbit 22s linear infinite; }
    .signal { animation: signal 4s ease-in-out infinite; }
    .trace { stroke-dasharray: 75 449; animation: trace 10s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes signal { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes trace { to { stroke-dashoffset: -524; } }
    @media (prefers-reduced-motion: reduce) { .orbit, .signal, .trace { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="410" fill="url(#surface)"/>
    <rect width="600" height="410" fill="url(#dots)"/>
    <path d="M38 1H562" stroke="url(#accent)" stroke-width="3"/>
    <path d="M38 1H562" stroke="#DEFFF6" stroke-width="3" class="trace"/>
    <g class="orbit"><circle cx="508" cy="81" r="43" stroke="#4D6584" opacity=".55"/><circle cx="551" cy="81" r="4" fill="#79E8D1"/></g>
    <text x="508" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#D4E2F7">AC</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="38" y="55" width="270" height="38" rx="19" fill="#122C34" stroke="#28544F"/>
      <circle class="signal" cx="58" cy="74" r="4" fill="#79E8D1"/>
      <text x="73" y="79" fill="#9CEBD8" font-size="14" font-weight="600" letter-spacing="2">FULL-STACK DEVELOPER</text>
      <text x="35" y="188" fill="#F3F6FC" font-size="66" font-weight="750" letter-spacing="-2">Ayan</text>
      <text x="35" y="257" fill="#F3F6FC" font-size="66" font-weight="750" letter-spacing="-2">Chakraborty<tspan fill="#79E8D1">.</tspan></text>
      <text x="38" y="307" fill="#BDCADD" font-size="23">Interfaces. APIs. Useful products.</text>
      <path d="M38 351H73" stroke="#66E3CB" stroke-width="3" stroke-linecap="round"/>
      <text x="88" y="357" fill="#8FA5C0" font-size="14" letter-spacing="1.7">BUILD · LEARN · IMPROVE</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="598.5" height="408.5" rx="24" stroke="#304058" stroke-width="1.5"/>
</svg>
